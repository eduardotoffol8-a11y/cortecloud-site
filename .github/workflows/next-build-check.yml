name: Next build check
on:
  push:
    branches: [main]
jobs:
  build-next:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://dswqqmgadqwvisygnuib.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-placeholder
